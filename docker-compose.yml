services:
  postgres:
    image: postgres:16-alpine
    container_name: pendulum-postgres
    environment:
      POSTGRES_DB: pendulum
      POSTGRES_USER: pendulum
      POSTGRES_PASSWORD: pendulum
    ports:
      - "5432:5432"
    command:
      - postgres
      # A jobs table is the highest-churn table in the schema. These raise the ceiling on
      # concurrent workers and make autovacuum keep up with the dead tuples that churn produces.
      - -c
      - max_connections=200
      - -c
      - autovacuum_naptime=10s
      # Every statement that takes longer than this lands in the log. On a queue, a slow dispatch
      # query is the first symptom of index bloat, and you want to see it before latency does.
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pendulum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pendulum -d pendulum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pendulum-pgdata:
