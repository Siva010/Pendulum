services:
  postgres:
    image: postgres:16-alpine
    container_name: pendulum-postgres
    environment:
      POSTGRES_DB: pendulum
      POSTGRES_USER: pendulum
      POSTGRES_PASSWORD: pendulum
    ports:
      # Published on 5433, not 5432: a locally installed Postgres very often already owns 5432,
      # and the failure mode when it does is a container that will not start with an error that
      # says nothing about the port.
      - "5433:5432"
    command:
      - postgres
      # A jobs table is the highest-churn table in the schema. These raise the ceiling on
      # concurrent workers and make autovacuum keep up with the dead tuples that churn produces.
      - -c
      - max_connections=200
      - -c
      - autovacuum_naptime=10s
      # Every statement that takes longer than this lands in the log. On a queue, a slow dispatch
      # query is the first symptom of index bloat, and you want to see it before latency does.
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pendulum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pendulum -d pendulum"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose up -d` brings up Postgres alone, which is what the test suite and a locally
  # run server both want. The app is behind a profile so it is opt-in:
  #     docker compose --profile app up -d --build
  pendulum:
    build: .
    container_name: pendulum-server
    profiles: ["app"]
    environment:
      # Inside the compose network Postgres is reachable by service name on its own port, not the
      # 5433 published to the host.
      PENDULUM_DB_URL: jdbc:postgresql://postgres:5432/pendulum
      PENDULUM_DB_USER: pendulum
      PENDULUM_DB_PASSWORD: pendulum
      PENDULUM_WORKERS: "2"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Must exceed pendulum.drain-timeout (20s) or the drain is cut short and in-flight jobs wait
    # out their full lease instead of being handed back.
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  pendulum-pgdata:
